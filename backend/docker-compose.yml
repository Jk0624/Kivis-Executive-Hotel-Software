services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kivis-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3001}
    ports:
      - "${HOST_PORT:-3001}:${PORT:-3001}"
    volumes:
      - uploads:/app/uploads
    command: sh -c "./node_modules/.bin/prisma migrate deploy && node dist/main.js"

volumes:
  uploads:
